name: Ingest insider transaction filings

on:
  schedule:
    - cron: "*/15 * * * *" # US (SEC EDGAR)
    - cron: "0 * * * *" # Germany (EQS News) — deliberately less frequent, see scripts/lib/eqsClient.ts
    - cron: "0 */6 * * *" # US politicians (House Stock Watcher) — PTRs lag transactions by up to 45 days anyway
    - cron: "0 */2 * * *" # Wirtschaftsnews (ECB, Destatis, EQS Corporate) — press releases, not minute-by-minute
    - cron: "0 6 * * *" # Hedgefonds (SEC 13F) — quarterly filings, daily poll is more than enough
    - cron: "30 * * * *" # Spain (CNMV) — similar volume to Germany, offset by 30min to spread load
    - cron: "45 * * * *" # Sweden (Finansinspektionen) — similar volume to Germany/Spain, offset by 45min to spread load
    - cron: "10 * * * *" # Netherlands (AFM) — low volume, one bulk export request per run, offset by 10min to spread load (avoids the US run's :00/:15/:30/:45 slots)
    - cron: "20 * * * *" # Belgium (FSMA) — low volume, but throttled at 30s/request (robots.txt Crawl-delay), offset by 20min to spread load
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ingest US (SEC EDGAR)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *')
        run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Ingest Germany (EQS News)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *')
        run: npm run ingest:de
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Ingest US politicians (House Stock Watcher)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *')
        run: npm run ingest:us-politicians
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Ingest news (ECB, Destatis, EQS Corporate)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */2 * * *')
        run: npm run ingest:news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Ingest hedge funds (SEC 13F)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *')
        run: npm run ingest:hedge-funds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Ingest Spain (CNMV)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 * * * *')
        run: npm run ingest:es
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Ingest Sweden (Finansinspektionen)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '45 * * * *')
        run: npm run ingest:se
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Ingest Netherlands (AFM)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '10 * * * *')
        run: npm run ingest:nl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Ingest Belgium (FSMA)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '20 * * * *')
        run: npm run ingest:be
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
